version: "3"
tasks:
    setup:
        cmd: npm install
    compiler:
        cmd: (cd compiler && npm run build) && node compiler {{.CLI_ARGS}}
        env:
            NODE_OPTIONS: "--enable-source-maps"
    test:
        cmds:
            - (cd compiler && npm run test -- {{.CLI_ARGS}})
            - (cd tests && npx jest --no-watchman test.js {{.CLI_ARGS}})
    install:
        cmd: (cd compiler && npm run exe)
    vscode:
        dir: vscode
        cmd: npm run extension
